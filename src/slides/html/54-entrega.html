<section id="entrega" data-transition="push" style="background:#0B0E13;color:#EEF0E8;font-family:'Space Grotesk', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:28px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;color:#C6F33A;text-transform:uppercase">05 · Garantías de entrega</p><h2 style="font-size:68px;font-weight:700;line-height:1.05;letter-spacing:-2px">¿Cuántas veces llega un mensaje?</h2><x-embed style="position:absolute;left:128px;top:300px;width:1664px;height:540px"><!doctype html><html><head><style>body{margin:0;background:transparent;font-family:ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif;color:#EEF0E8;overflow:hidden}
.n{position:absolute;box-sizing:border-box;border:3px solid #2B3647;background:#141A22;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:700;gap:4px;line-height:1.15}

.o0{opacity:0}svg{position:absolute;left:0;top:0;overflow:visible}</style></head><body><div id="w"></div><script>const $=i=>typeof i=='string'?document.getElementById(i):i,S=ms=>new Promise(r=>setTimeout(r,ms));

const lit=(e,c,bg)=>A(e,[{borderColor:c,background:bg||'#141A22'}],{duration:350});

const reset=()=>{document.querySelectorAll('.tmp').forEach(e=>e.remove());document.getAnimations().forEach(a=>a.cancel())};const R=[['At-most-once','como mucho una vez','#FF6B8B'],['At-least-once','al menos una vez','#C6F33A'],['Exactly-once','exactamente una vez','#6EA8FF']];
const rr=R.map(([t,s,c],i)=>{const y=i*180;mk('n',t+'<small>'+s+'</small>',{left:'0',top:px(y),width:'380px',height:'150px',borderColor:c});
mk('n','Broker',{left:'430px',top:px(y+30),width:'180px',height:'90px',fontSize:'24px'});
mk('',' ',{position:'absolute',left:'610px',top:px(y+74),width:'774px',height:'3px',background:'#2B3647'});
const cs=mk('n','Consumidor<small id="r'+i+'">&nbsp;</small>',{left:'1384px',top:px(y+20),width:'280px',height:'110px',fontSize:'24px'});return [y,cs]});
const env=(y,c)=>{const e=mk('chip tmp','msg',{left:'640px',top:px(y+56),background:c,color:'#0B0E13',opacity:0});show(e,{duration:150});return e};
